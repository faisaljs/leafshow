name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace

      - name: Prepare builds directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/out"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$GITHUB_WORKSPACE/out"
          git init
          git checkout --orphan builds
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Use find to robustly copy all .cs3 files, regardless of output path
          find "$GITHUB_WORKSPACE/src" -name "*.cs3" -type f -exec cp {} . \;
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" . 2>/dev/null || true

          # Generate the repo.json manifest required by the Cloudstream app[reference:1]
          cat > repo.json <<EOF
          {
            "name": "Leafshow Repo",
            "description": "Leafshow Cloudstream extensions",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/builds/plugins.json"
            ]
          }
          EOF

          echo "=== artifacts ==="
          ls -la
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/out"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Build $GITHUB_SHA"
          git push --force origin builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}